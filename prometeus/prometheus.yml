global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Метрики вашего Go-приложения (порт изменен на приватный 8081)
  - job_name: "go-app"
    static_configs:
      - targets: ["app:8081"]

  # 2. Метрики железа EC2 (так как network_mode: host, собираем через localhost)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # 3. Метрики потребления ресурсов Docker-контейнеров
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # 4. Самомониторинг Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
