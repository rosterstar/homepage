name: Build, push and deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Тегируем двумя тегами: SHA для воспроизводимости, latest для удобства
          tags: |
            rstarostsenko/go-aws-home:latest
            rstarostsenko/go-aws-home:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Деплоим конкретный SHA — не latest.
          # Это гарантирует что на сервере окажется именно тот образ, который только что собрали.
          script: |
            cd /home/ec2-user/app
            export IMAGE_TAG=${{ github.sha }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            docker compose pull app
            docker compose up -d app
            docker image prune -f
